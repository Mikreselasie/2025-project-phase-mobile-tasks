name: ecommerce
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  bloc_test: ^10.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  go_router: ^16.1.0
  http_client_helper: ^3.0.0
  image_picker: ^1.0.4
  internet_connection_checker_plus: ^2.7.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.2

dev_dependencies:
  build_runner: ^2.4.6
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 900
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/CaveatBrush-Regular.ttf
          weight: 400
